# One editable configuration for the local Source Package.
#
# Change data.num_transitions to collect a larger or smaller dataset. To keep an
# earlier dataset, also change data.dataset_path before collecting again. Lab 1
# exposes EPOCHS separately in the notebook so students can change training time
# without editing implementation code. Lab 2 uses the model exported by Lab 1.

seed: 0

env:
  id: highway-fast-v0
  image_size: 64
  stack_size: 4
  policy_frequency: 1
  simulation_frequency: 15
  lanes_count: 4
  vehicles_count: 25
  duration: 30
  offscreen_rendering: true
  scaling: 1.75

data:
  num_transitions: 20000
  dataset_path: datasets/highway.npz
  val_fraction: 0.1
  batch_size: 64
  num_workers: 0

model:
  latent_dim: 64
  use_decoder: true
  use_reward_head: true
  encoder_channels: [32, 64, 128]
  dynamics_hidden: [256, 256]

training:
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0
  grad_clip: 1.0
  device: cpu
  recon_loss_weight: 1.0
  reward_loss_weight: 1.0
  dynamics_loss_weight: 1.0
  log_dir: runs
  checkpoint_dir: checkpoints/reference
  checkpoint_every: 1

imagination:
  horizon: 10

planning:
  enabled: true
  num_sequences: 64
  horizon: 6
